<!-- knight.svg -->
<svg
        width="128"
        height="128"
        viewBox="0 0 128 128"
        version="1.1"
        xmlns="http://www.w3.org/2000/svg"
>
    <!--
         The 'path' below is an approximate outline for a chess knight.
         You can adjust the path commands (M, L, C, etc.) to reshape the piece.
         stroke="black" and fill="none" ensure we have a black outline with no fill.
     -->
    <path
            d="
      M 28,96
        L 100,96
        L 100,84
        L 88,84
        L 88,68
        C 88,62 85,56 79,52
        L 79,40
        C 85,34 84,22 79,18
        L 70,18
        L 60,30
        C 56,35 53,42 53,48
        L 53,64
        L 44,64
        L 44,80
        L 28,80
        Z
    "
            fill="none"
            stroke="black"
            stroke-width="4"
    />

    <!-- Eye (small circle) - optional -->
    <circle
            cx="70"
            cy="34"
            r="3"
            fill="black"
    />
</svg>
