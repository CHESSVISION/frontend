<svg version="1.1"
     baseProfile="full"
     width="1550" height="150"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Define a chessboard pattern to use as the text fill -->
    <defs>
        <pattern id="chessboard"
                 x="0" y="0"
                 width="10" height="10"
                 patternUnits="userSpaceOnUse">
            <!-- Black square -->
            <rect x="0" y="0" width="5" height="5" fill="#000000" />
            <!-- White square -->
            <rect x="5" y="0" width="5" height="5" fill="#FFFFFF" />
            <!-- White square -->
            <rect x="0" y="5" width="5" height="5" fill="#FFFFFF" />
            <!-- Black square -->
            <rect x="5" y="5" width="5" height="5" fill="#000000" />
        </pattern>
    </defs>

    <!-- Text with the chessboard pattern -->
    <text x="0" y="150"
          fill="url(#chessboard)"
          font-family="Arial Black"
          font-size="200"
          font-weight="bold"
          letter-spacing="2">
        CHESSVISION
    </text>

</svg>